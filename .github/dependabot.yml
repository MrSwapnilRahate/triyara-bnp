version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: ['dependencies']
    commit-message:
      prefix: 'chore(deps)'
    groups:
      prod-minor-patch:
        dependency-type: production
        update-types: ['minor', 'patch']
      dev-minor-patch:
        dependency-type: development
        update-types: ['minor', 'patch']
    # Security updates are raised automatically regardless of schedule.

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    labels: ['dependencies', 'ci']
    commit-message:
      prefix: 'chore(ci)'
