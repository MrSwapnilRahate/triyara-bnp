version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: ['dependencies']
    commit-message:
      prefix: 'chore(deps)'
    groups:
      prod-minor-patch:
        dependency-type: production
        update-types: ['minor', 'patch']
      dev-minor-patch:
        dependency-type: development
        update-types: ['minor', 'patch']
    # Policy: security, patch and minor updates only.
    #
    # `version-update:semver-major` suppresses SCHEDULED major-version bumps
    # only. Dependabot security updates are raised independently of this rule,
    # so a vulnerability is still surfaced even when the fix is a major release.
    #
    # Majors are handled deliberately as their own piece of work: framework
    # majors (Next, Tailwind, TypeScript, Vitest) carry breaking changes that
    # must not arrive as unreviewed automated PRs.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # @sentry/server-utils 10.72.0 stopped declaring
      # @apm-js-collab/code-transformer-bundler-plugins and vendored it instead,
      # with a path that resolves to a non-file URL. Under pnpm's strict layout
      # that throws `TypeError: The URL must be of scheme file` while loading the
      # module, which fails the suite before any test runs. 10.73.0 ships the
      # same packaging, so both lines are held back. Only these two minors are
      # named: a later release that fixes the packaging is still proposed.
      - dependency-name: '@sentry/nextjs'
        versions: ['10.72.x', '10.73.x']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    labels: ['dependencies', 'ci']
    commit-message:
      prefix: 'chore(ci)'
    # Same policy for action versions: a major action bump changes runner
    # behaviour and is reviewed deliberately, not merged automatically.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
