name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# A deploy must never be cancelled part-way. Between `migrate deploy` and the
# Vercel deploy the database is ahead of the running code; cancelling there
# leaves that state with nothing reporting it.

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    name: Production deploy
    runs-on: ubuntu-latest

    # Deliberate off switch. Every merge to main is a no-op until the
    # DEPLOY_ENABLED repository variable is set to 'true'.
    # See docs/07-deployment/README.md.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Pinned to a major: an unpinned CLI turns an upstream release into a
      # failed production deploy on an unrelated day.
      - name: Install Vercel CLI
        run: npm install --global vercel@58

      - name: Pull the production environment from Vercel
        # Vercel holds the runtime configuration; this is the single source
        # of truth for it. Nothing is duplicated into GitHub secrets except
        # the values needed to reach Vercel and the direct migration URL.
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Require every runtime variable before deploying
        # Names only - no value is printed.
        run: |
          set -euo pipefail

          env_file=""
          for candidate in .vercel/.env.production.local .env.production.local; do
            if [ -f "$candidate" ]; then
              env_file="$candidate"
              break
            fi
          done

          if [ -z "$env_file" ]; then
            echo "::error::vercel pull produced no production environment file."
            echo "Looked for .vercel/.env.production.local and .env.production.local."
            exit 1
          fi

          if [ -n "${GITHUB_ENV:-}" ]; then
            echo "PRODUCTION_ENV_FILE=$env_file" >> "$GITHUB_ENV"
          fi

          missing=""

          for key in DATABASE_URL AUTH_SECRET PUBLIC_REGISTRATION_ORG_SLUG \
                     STORAGE_PROVIDER STORAGE_BUCKET \
                     STORAGE_ACCESS_KEY_ID STORAGE_SECRET_ACCESS_KEY \
                     RESEND_API_KEY EMAIL_FROM; do
            grep -q "^${key}=" "$env_file" || missing="$missing $key"
          done

          if [ -n "$missing" ]; then
            echo "::error::Missing from the Vercel production environment:$missing"
            echo "Set them in the Vercel project (Settings, Environment Variables, Production)."
            exit 1
          fi

          # Vercel may redact sensitive runtime values when pulling the
          # production environment. Validate presence, not the value itself.
          # The real value is still available to the deployed application.
          if ! grep -q '^STORAGE_ENDPOINT=' "$env_file"; then
            echo "::error::STORAGE_ENDPOINT is missing from the Vercel production environment."
            exit 1
          fi

      - name: Apply database migrations
        # Before the deploy, never after: new code must not reach traffic ahead
        # of the schema it expects.
        #
        # Migrations use the DIRECT Neon endpoint because the pooled
        # PgBouncer endpoint cannot reliably hold the session-level advisory
        # lock used by Prisma's migration engine.
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DIRECT_DATABASE_URL is not set."
            echo "Migrations require the Neon DIRECT endpoint - the host WITHOUT '-pooler'."
            echo "The pooled URL in Vercel cannot hold the advisory lock the migration engine takes."
            echo "Add it under Settings, Secrets and variables, Actions, repository secrets."
            exit 1
          fi

          pnpm --filter @triyara/db db:deploy

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail

          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      - name: Smoke check the deployment
        # Vercel deployment protection can return HTTP 302 to unauthenticated
        # requests. `vercel curl` authenticates the request through Vercel CLI.
        #
        # The health endpoint proves both that the deployment boots and that
        # the runtime can reach the production database.
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail

          health=""

          for _ in 1 2 3 4 5 6; do
            health=$(vercel curl "$DEPLOY_URL/api/health" \
              --token="$VERCEL_TOKEN" 2>/dev/null || true)

            if echo "$health" | grep -q '"status":"ok"'; then
              break
            fi

            sleep 5
          done

          if ! echo "$health" | grep -q '"status":"ok"'; then
            echo "::error::Health check failed for $DEPLOY_URL/api/health"
            echo "$health"
            exit 1
          fi

          if ! echo "$health" | grep -q '"database":"ok"'; then
            echo "::error::Health check returned status ok but database is not ok."
            echo "$health"
            exit 1
          fi

          echo "Health check passed: $DEPLOY_URL/api/health"

      - name: Summary
        if: always()
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "### Production deploy"
            echo
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- deployment: ${DEPLOY_URL:-not created}"
          } >> "$GITHUB_STEP_SUMMARY"
