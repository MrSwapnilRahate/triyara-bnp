name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          AUTH_SECRET: ci-placeholder-secret-000000000000

  database:
    name: Migrations, drift, seed, integration tests
    runs-on: ubuntu-latest
    # The quality job runs with no DATABASE_URL, so every integration test skips
    # there. This job is the one that actually exercises the schema: raw-SQL
    # constraints, expression indexes and seed data are invisible to typecheck.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: triyara
          POSTGRES_PASSWORD: triyara
          POSTGRES_DB: triyara_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://triyara:triyara@localhost:5432/triyara_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Replay every migration from an empty database
        run: pnpm --filter @triyara/db db:deploy

      - name: Fail on schema drift
        # A datamodel that no longer matches the recorded migrations means the
        # next `migrate dev` would silently generate a destructive diff.
        run: >-
          pnpm --filter @triyara/db exec prisma migrate diff
          --from-schema-datasource prisma/schema.prisma
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      - name: Seed
        run: pnpm --filter @triyara/db db:seed

      - name: Seed again - row counts must not move
        # Re-running without crashing is not proof of idempotency; the row counts
        # are. A seed that duplicates rows still exits 0.
        run: |
          set -euo pipefail
          count() {
            psql "$DATABASE_URL" -tAc "
              SELECT string_agg(n || '=' || c, ',' ORDER BY n) FROM (
                SELECT 'quotation' n, count(*) c FROM \"Quotation\"
                UNION ALL SELECT 'item', count(*) FROM \"QuotationItem\"
                UNION ALL SELECT 'option', count(*) FROM \"QuotationSourceOption\"
                UNION ALL SELECT 'charge', count(*) FROM \"QuotationCharge\"
                UNION ALL SELECT 'tax', count(*) FROM \"QuotationTax\"
                UNION ALL SELECT 'approval', count(*) FROM \"QuotationApproval\"
                UNION ALL SELECT 'comment', count(*) FROM \"QuotationComment\"
                UNION ALL SELECT 'revision', count(*) FROM \"QuotationRevision\"
                UNION ALL SELECT 'term', count(*) FROM \"PaymentTerm\"
                UNION ALL SELECT 'rate', count(*) FROM \"ExchangeRate\"
                UNION ALL SELECT 'product', count(*) FROM \"Product\"
                UNION ALL SELECT 'supplier', count(*) FROM \"Supplier\"
                UNION ALL SELECT 'rfq', count(*) FROM \"RFQ\"
              ) t"
          }
          before=$(count)
          pnpm --filter @triyara/db db:seed
          after=$(count)
          echo "before: $before"
          echo "after:  $after"
          if [ "$before" != "$after" ]; then
            echo "::error::The seed is not idempotent - row counts changed on re-run."
            exit 1
          fi

      - name: Integration tests - repositories
        run: pnpm --filter @triyara/db test

      # The web package's API integration tests are gated on DATABASE_URL too,
      # and the quality job has none - so until this step existed they skipped
      # in both jobs and nothing exercised the route handlers against real
      # PostgreSQL. Filtered to the integration files so the jsdom unit tests
      # are not run a second time; the quality job already covers those.
      - name: Integration tests - API routes
        run: pnpm --filter @triyara/web exec vitest run integration.test

  e2e:
    name: Browser journeys (Playwright)
    runs-on: ubuntu-latest
    # The public registration wizards are client-rendered from end to end: no
    # <form> element, no `required` attributes, no no-script fallback. Every
    # other job in this pipeline can pass while both of them are broken in a
    # browser, which is exactly what a production audit found - the flow could
    # be checked as far as server-rendered HTML and no further.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: triyara
          POSTGRES_PASSWORD: triyara
          POSTGRES_DB: triyara_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # A database of this job's own. Registration is a write, and these tests
      # leave real rows behind; they land here and nowhere else.
      DATABASE_URL: postgresql://triyara:triyara@localhost:5432/triyara_e2e
      AUTH_SECRET: ci-placeholder-secret-000000000000
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Before anything that loads Prisma Client. `pnpm --filter @triyara/web
      # build` runs that package's script alone, so the db package's own build -
      # which is `prisma generate` - never fires, and the server would start
      # without a query engine for this runner's platform. `migrate deploy` does
      # not generate one either, and the seed loads the client.
      - name: Generate the Prisma client for this runner
        run: pnpm --filter @triyara/db db:generate

      - name: Prepare the database
        run: |
          pnpm --filter @triyara/db db:deploy
          pnpm --filter @triyara/db db:seed

      # Chromium only. The suite pins one browser, and downloading the other two
      # would add minutes for coverage nothing here asserts.
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      # Builds and starts the app itself, via the config's webServer.
      #
      # Named specs rather than the whole directory. The rest of e2e/ predates
      # this job and has never run in CI - `pnpm test:e2e` could not load its
      # config at all - so those specs are unproven here and would block this
      # job on breakage that has nothing to do with these flows. Widening the
      # net further is worth doing on its own, deliberately.
      #
      # The portal specs each provision their own approved buyer through the
      # real provisioning service and set the password through the UI, so they
      # need the seeded organization and administrator that `db:seed` creates
      # above. They write rows, which is why this job has a database of its own.
      - name: Registration and portal end-to-end tests
        run: >-
          pnpm test:e2e
          e2e/registration-buyer.spec.ts
          e2e/registration-supplier.spec.ts
          e2e/registration-mobile.spec.ts
          e2e/portal-buyer-journey.spec.ts
          e2e/portal-buyer-isolation.spec.ts
          e2e/portal-buyer-mobile.spec.ts

      - name: Upload the report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
