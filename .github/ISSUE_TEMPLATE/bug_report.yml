name: Bug report
description: Report a defect in the platform
labels: ['type: bug', 'status: triage']
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and the impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        [accounts, supplier, documents, verification, activity, notifications, auth, infra, other]
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: browser, OS, commit hash / release tag
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues
          required: true
        - label: This does not contain secrets or personal data
          required: true
