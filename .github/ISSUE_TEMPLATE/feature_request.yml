name: Feature request
description: Propose a new capability
labels: ['type: feature', 'status: triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / business motivation
      description: What user or business problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        [
          accounts,
          supplier,
          buyer,
          documents,
          verification,
          activity,
          notifications,
          rfq,
          orders,
          matching,
          dashboard,
          infra,
          other,
        ]
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Architecture / data / API impact (if known)
